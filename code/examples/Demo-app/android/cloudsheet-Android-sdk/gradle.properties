# CloudSheetSDK Library Properties

# Maven Coordinates
GROUP=com.opencloudsheet
ARTIFACT_ID=cloudsheet-sdk
VERSION_NAME=0.1.0-SNAPSHOT

# Library Information
POM_NAME=CloudSheetSDK Android
POM_DESCRIPTION=Privacy-first framework for building collaborative, transparent record-keeping applications
POM_URL=https://github.com/opencloudsheet/cloudsheet-sdk
POM_LICENSE_NAME=BSD 3-Clause License
POM_LICENSE_URL=https://opensource.org/licenses/BSD-3-Clause

# Build Properties
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# Gradle Configuration
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
